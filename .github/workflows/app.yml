# 파크골프 수첩 앱(app/)을 GitHub Pages 에 올림
# 준비 (한 번만): 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: 앱 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 계산 테스트
        run: node --test app/tests/calc.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 주소 알려 주기
        run: |
          {
            echo "## ✅ 앱을 올렸어요"
            echo ""
            echo "할머니 폰에서 이 주소를 여세요:"
            echo ""
            echo "\`${{ steps.deploy.outputs.page_url }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
