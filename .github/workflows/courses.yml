# 전국 파크골프장 목록 만들기 (공공데이터포털 지자체 표준데이터를 모아 app/data/courses.json 생성)
# 실행: Actions 탭 → "전국 파크골프장 목록 만들기" → Run workflow  (매달 1일에도 자동으로 갱신)
name: 전국 파크골프장 목록 만들기

on:
  workflow_dispatch:
    inputs:
      geo_only:
        description: "위치만 다시 바로잡기 (포털에서 다시 받지 않음)"
        type: boolean
        default: false
      lookup:
        description: "카카오 장소 검색만 해 보기 (이름을 | 로 구분, 목록은 안 바뀜)"
        type: string
        default: ""
  schedule:
    - cron: "17 18 1 * *"   # 매달 2일 03:17 (한국 시간)

permissions:
  contents: write
  actions: write

concurrency:
  group: courses
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 장소 검색만
        if: inputs.lookup != ''
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          PG_LOOKUP: ${{ inputs.lookup }}
        run: python3 scripts/kakao_lookup.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 목록 만들기
        if: inputs.lookup == ''
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          PG_GEO_ONLY: ${{ inputs.geo_only && '1' || '0' }}
        run: |
          set -o pipefail
          python3 scripts/build_courses.py | tee build.log
      - name: 요약
        if: always() && inputs.lookup == ''
        run: |
          {
            echo "## 전국 파크골프장 목록"
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo "실행 기록 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 저장하고 앱 다시 올리기
        if: inputs.lookup == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- app/data data-cache \
             && [ -z "$(git ls-files -o --exclude-standard app/data data-cache)" ]; then
            echo "바뀐 내용이 없어요."
            exit 0
          fi
          git config user.name "courses-bot"
          git config user.email "courses-bot@users.noreply.github.com"
          git add app/data data-cache
          git commit -m "전국 파크골프장 목록 갱신 ($(date -u +%F))"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
          gh workflow run app.yml --ref main
